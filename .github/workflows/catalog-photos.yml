name: Import catalog photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mebelcatalog/mebel-alihan
          ref: fe2b095087d978c42c4b16fa82183a76bf98a5d6
          path: .catalog-source
          sparse-checkout: photos
      - name: Import shared catalog
        run: |
          cp -R .catalog-source/photos ./photos
          rm -rf .catalog-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || git commit -m "Import catalog photos"
          git push
